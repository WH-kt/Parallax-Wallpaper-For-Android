# Fork modification (2026): build signed releases with private repository secrets and publish repository-scoped update metadata.
name: Build and Release APK

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "Configure the KEYSTORE_BASE64 repository secret first."; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo "Configure the signing password repository secrets first."; exit 1; }
          test -n "$KEY_ALIAS" || { echo "Configure the KEY_ALIAS repository secret first."; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "Configure the signing password repository secrets first."; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/tianyin-release.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/tianyin-release.jks" >> "$GITHUB_ENV"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Test and build Release APK
        run: ./gradlew testDebugUnitTest assembleRelease

      - name: Prepare versioned release files
        id: release
        run: |
          VERSION=$(grep -m 1 'versionName' app/build.gradle.kts | sed 's/.*versionName = "\([^"]*\)".*/\1/')
          VERSION_CODE=$(grep -m 1 'versionCode' app/build.gradle.kts | sed 's/.*versionCode = \([0-9]*\).*/\1/')
          APK_NAME="tianyinwallpaper-v${VERSION}.apk"
          APK_FILE="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK_FILE"
          cp "$APK_FILE" "app/build/outputs/apk/release/$APK_NAME"
          APK_SIZE=$(stat -c%s "app/build/outputs/apk/release/$APK_NAME")
          APK_MD5=$(md5sum "app/build/outputs/apk/release/$APK_NAME" | cut -d ' ' -f 1)
          CURRENT_TIME=$(date +%s%3N)
          CHANGELOG=$(awk "/^## ${VERSION}$/{found=1;next} /^## /{found=0} found && NF" update/changelog.md)
          test -n "$CHANGELOG" || { echo "Add a ## $VERSION section to update/changelog.md."; exit 1; }
          printf '%s\n' "$CHANGELOG" > "$RUNNER_TEMP/release-notes.md"
          DOWNLOAD_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}/${APK_NAME}"
          jq -n \
            --arg code "$VERSION_CODE" \
            --arg name "$VERSION" \
            --arg filename "$APK_NAME" \
            --arg url "$DOWNLOAD_URL" \
            --arg time "$CURRENT_TIME" \
            --arg des "$CHANGELOG" \
            --arg size "$APK_SIZE" \
            --arg md5 "$APK_MD5" \
            '{code:($code|tonumber),name:$name,filename:$filename,url:$url,time:($time|tonumber),des:$des,size:($size|tonumber),md5:$md5}' \
            > update/update_info.json
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: tianyinwallpaper-v${{ steps.release.outputs.version }}
          path: app/build/outputs/apk/release/${{ steps.release.outputs.apk_name }}

      - name: Update release metadata
        if: github.ref == 'refs/heads/main'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add update/update_info.json
          if ! git diff --cached --quiet; then
            git commit -m "Update release metadata for ${{ steps.release.outputs.tag }}"
            git push
          fi

      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: main
          name: 天音壁纸 ${{ steps.release.outputs.tag }}
          body_path: ${{ runner.temp }}/release-notes.md
          files: app/build/outputs/apk/release/${{ steps.release.outputs.apk_name }}
